proguardVersion     = 7.3.3
dProtectVersion     = 1.1.0-agp8
dprotectCoreVersion = 1.0.0
dprotectCoreCommit  = latest

# The version of ProGuardCORE that sub-projects are built with
proguardCoreVersion = 9.0.8
gsonVersion = 2.9.0
kotlinVersion = 1.9.22
target = 17

# Optionally compile the WTK plugin.
wtkDir = /usr/local/java/wtk2.1
wtkHome = /usr/local/java/wtk

org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.caching=true
