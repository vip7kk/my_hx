// This build file illustrates how to apply dProtect in the Android build
// process, with dProtect's own plugin instead of the built-in minification
// support of the Android Gradle plugin.
buildscript {
    repositories {
        mavenLocal()   // For local testing
        google()       // For the Android Gradle plugin.
        mavenCentral() // For the dProtect Gradle Plugin and anything else.
    }
    dependencies {
        classpath 're.obfuscator:dprotect-gradle:1.1.0-agp8'
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

apply plugin: 'com.android.application'
apply plugin: 're.obfuscator.dprotect'

repositories {
    google()       // For the Android plugin.
    mavenCentral() // For anything else.
}

android {
    namespace 'com.example'
    compileSdk 33

    signingConfigs {
        debug {
            storeFile     file('debug.keystore')
            storePassword 'android'
            keyAlias      'androiddebugkey'
            keyPassword   'android'
        }
    }

    defaultConfig {
        minSdk    21
        targetSdk 33
        signingConfig signingConfigs.debug
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs         = ['src']
            resources.srcDirs    = ['src']
            aidl.srcDirs         = ['src']
            renderscript.srcDirs = ['src']
            res.srcDirs          = ['res']
            assets.srcDirs        = ['assets']
        }
    }

    buildTypes {
        debug {
            // Disable the built-in minification
            minifyEnabled false
        }
        release {
            // Disable the built-in minification
            minifyEnabled false
        }
    }
}

dProtect {
    configurations {
        release {
            defaultConfiguration 'proguard-android-optimize.txt'
            configuration 'proguard-project.txt'
        }
    }
}
